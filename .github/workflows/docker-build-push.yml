name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: guest-management-system
      # Switch registry here: "dockerhub" | "ecr" | "ghcr"
      REGISTRY: ${{ vars.REGISTRY || 'dockerhub' }}
    permissions:
      contents: read        # checkout
      packages: write       # ghcr.io push
      id-token: write       # OIDC for AWS (keyless auth)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      # ── Registry: Docker Hub ──────────────────────────────────────────────
      - name: Log in to Docker Hub
        if: env.REGISTRY == 'dockerhub'
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Registry: AWS ECR (keyless via OIDC — no long-lived keys) ─────────
      - name: Configure AWS credentials (OIDC)
        if: env.REGISTRY == 'ecr'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.REGISTRY == 'ecr'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Registry: GitHub Container Registry ───────────────────────────────
      - name: Log in to GHCR
        if: env.REGISTRY == 'ghcr'
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no manual secret needed

      # ── Resolve full image path based on active registry ──────────────────
      - name: Resolve image path
        id: image
        run: |
          case "$REGISTRY" in
            dockerhub) echo "path=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME" >> $GITHUB_OUTPUT ;;
            ecr)       echo "path=${{ steps.ecr-login.outputs.registry }}/$IMAGE_NAME" >> $GITHUB_OUTPUT ;;
            ghcr)      echo "path=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME" >> $GITHUB_OUTPUT ;;
          esac

      # ── Build metadata (consistent tags + OCI labels) ─────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.path }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build & push ───────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # OCI provenance labels
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true      # SLSA provenance attestation
          sbom: true            # Software Bill of Materials

      # ── Post-build: vulnerability scan ────────────────────────────────────
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.path }}:latest
          format: table
          exit-code: 1                  # fail the job if CRITICAL CVEs found
          severity: CRITICAL,HIGH
          ignore-unfixed: true          # skip CVEs with no fix yet